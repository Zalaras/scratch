name: CI
on:
  push:
    branches: ['feat/**']
  pull_request:
    branches: [ci-test/base]
jobs:
  cli-lint:
    name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'develop' || startsWith(github.head_ref, 'feat/'))) && 'cli-lint (push run)' || 'cli-lint' }}
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'develop' || startsWith(github.head_ref, 'feat/'))) }}
    runs-on: ubuntu-latest
    steps:
      - run: echo lint ok
  test:
    name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'develop' || startsWith(github.head_ref, 'feat/'))) && 'test (push run)' || 'test' }}
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'develop' || startsWith(github.head_ref, 'feat/'))) }}
    runs-on: ubuntu-latest
    steps:
      - if: contains(github.event.head_commit.message, '[ci-test-fail]')
        run: exit 1
      - run: echo test ok
